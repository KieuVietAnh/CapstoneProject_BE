name: Deploy Urban Service API to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE: urban-service-api
  CONTAINER_NAME: urban-service-api
  APP_DIR: /var/www/urban-service-be

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore UrbanService.sln

      - name: Build
        run: dotnet build UrbanService.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test UrbanService.sln --configuration Release --no-build

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: production
      url: http://152.42.177.174

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:latest .
          docker save ${{ env.DOCKER_IMAGE }}:latest | gzip > image.tar.gz

      - name: Copy image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT }}
          source: "image.tar.gz,docker-compose.prod.yml"
          target: "${{ env.APP_DIR }}"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT }}
          script: |
            set -e

            mkdir -p ${{ env.APP_DIR }}
            cd ${{ env.APP_DIR }}

            echo "Loading Docker image..."
            gunzip -c image.tar.gz | docker load

            echo "Creating .env file..."
            cat > .env << EOF
            DB_CONNECTION_STRING=${{ secrets.DB_CONNECTION_STRING }}
            JWT_KEY=${{ secrets.JWT_KEY }}
            JWT_ISSUER=${{ secrets.JWT_ISSUER }}
            JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
            BREVO_SENDER_EMAIL=${{ secrets.BREVO_SENDER_EMAIL }}
            BREVO_SENDER_NAME=${{ secrets.BREVO_SENDER_NAME }}
            GOOGLE_AUTH_CLIENT_ID=${{ secrets.GOOGLE_AUTH_CLIENT_ID }}
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
            PAYOS_CLIENT_ID=${{ secrets.PAYOS_CLIENT_ID }}
            PAYOS_API_KEY=${{ secrets.PAYOS_API_KEY }}
            PAYOS_CHECKSUM_KEY=${{ secrets.PAYOS_CHECKSUM_KEY }}
            PAYOS_RETURN_URL=${{ secrets.PAYOS_RETURN_URL }}
            PAYOS_CANCEL_URL=${{ secrets.PAYOS_CANCEL_URL }}
            AI_BASE_URL=${{ secrets.AI_BASE_URL }}
            AI_MODEL=${{ secrets.AI_MODEL }}
            AI_TIMEOUT_SECONDS=${{ secrets.AI_TIMEOUT_SECONDS }}
            AI_MAX_IMAGES_PER_FEEDBACK=${{ secrets.AI_MAX_IMAGES_PER_FEEDBACK }}
            AI_MAX_IMAGE_BYTES=${{ secrets.AI_MAX_IMAGE_BYTES }}
            AI_REVIEW_FAILURE_RETRY_DELAY_MINUTES=${{ secrets.AI_REVIEW_FAILURE_RETRY_DELAY_MINUTES }}
            AI_NUM_PREDICT=${{ secrets.AI_NUM_PREDICT }}
            AI_NUM_CONTEXT=${{ secrets.AI_NUM_CONTEXT }}
            AI_TEMPERATURE=${{ secrets.AI_TEMPERATURE }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            OPENROUTER_MODEL=${{ secrets.OPENROUTER_MODEL }}
            OPENROUTER_BASE_URL=${{ secrets.OPENROUTER_BASE_URL }}
            OPENROUTER_HTTP_REFERER=${{ secrets.OPENROUTER_HTTP_REFERER }}
            OPENROUTER_X_TITLE=${{ secrets.OPENROUTER_X_TITLE }}
            MESSENGER_PAGE_ACCESS_TOKEN=${{ secrets.MESSENGER_PAGE_ACCESS_TOKEN }}
            MESSENGER_VERIFY_TOKEN=${{ secrets.MESSENGER_VERIFY_TOKEN }}
            MESSENGER_APP_SECRET=${{ secrets.MESSENGER_APP_SECRET }}
            MESSENGER_SUBMISSION_USER_ID=${{ secrets.MESSENGER_SUBMISSION_USER_ID }}
            MESSENGER_GRAPH_API_VERSION=v25.0
            MESSENGER_ALLOWED_MEDIA_HOST_SUFFIXES=${{ secrets.MESSENGER_ALLOWED_MEDIA_HOST_SUFFIXES }}
            MESSENGER_MAX_IMAGES_PER_FEEDBACK=${{ secrets.MESSENGER_MAX_IMAGES_PER_FEEDBACK }}
            MESSENGER_MAX_IMAGE_BYTES=${{ secrets.MESSENGER_MAX_IMAGE_BYTES }}
            SLA_MONITORING_ENABLED=${{ secrets.SLA_MONITORING_ENABLED }}
            SLA_MONITORING_INTERVAL_MINUTES=${{ secrets.SLA_MONITORING_INTERVAL_MINUTES }}
            SLA_MONITORING_INITIAL_DELAY_SECONDS=${{ secrets.SLA_MONITORING_INITIAL_DELAY_SECONDS }}
            SLA_MONITORING_WARNING_THRESHOLD_PERCENT=${{ secrets.SLA_MONITORING_WARNING_THRESHOLD_PERCENT }}
            DATABASE_MIGRATE_ON_STARTUP=true
            EOF

            echo "Stopping old container if exists..."
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true

            echo "Starting new container..."
            docker compose -f docker-compose.prod.yml up -d

            echo "Cleaning up..."
            rm -f image.tar.gz
            docker image prune -f

            echo "Current containers:"
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}"

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT }}
          script: |
            echo "Waiting for API health check..."
            for attempt in {1..12}; do
              if curl --fail --silent http://localhost:8080/health; then
                echo "API is healthy."
                docker logs --tail 50 ${{ env.CONTAINER_NAME }}
                exit 0
              fi
              sleep 5
            done

            echo "API health check failed."
            docker logs ${{ env.CONTAINER_NAME }} || true
            exit 1
